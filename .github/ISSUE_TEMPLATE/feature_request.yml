name: Feature request
description: Propose a language, tooling, library, or documentation improvement
title: "[Feature]: "
labels: [enhancement, discussion]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What should become easier or possible, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Show syntax or concrete behavior when relevant.
    validations:
      required: true
  - type: textarea
    id: profiles
    attributes:
      label: Source-profile impact
      description: Explain how both source profiles remain semantically equivalent.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable behavior and relevant correctness, performance, resource, or compatibility checks.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and the development plan.
          required: true
